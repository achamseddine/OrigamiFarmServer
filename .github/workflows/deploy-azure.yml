name: Deploy api to Azure Web App for Containers

# Manual only — this never runs on push. Builds api/ into an image, pushes
# it to Azure Container Registry, and points the target Web App at the new
# tag. See docs/AZURE_DEPLOYMENT.md for the one-time setup this assumes
# already exists (the registry, the Postgres databases, the Web App's
# application settings) and for how to run all of this by hand instead.
#
# Required repository secrets:
#   AZURE_CREDENTIALS   - JSON from:
#     az ad sp create-for-rbac --name origami-deploy --role contributor \
#       --scopes /subscriptions/<sub-id>/resourceGroups/<resource-group> \
#       --sdk-auth
#   ACR_NAME             - Azure Container Registry name (no ".azurecr.io")
#   AZURE_WEBAPP_NAME    - e.g. leb-container-test
#   AZURE_RESOURCE_GROUP - the resource group both of the above live in
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and deploy"
        required: false
        default: latest
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The farm app for the browser ships inside the image (served at /app/).
      # Resolve the newest web release of the app repository here, as
      # publish-image.yml does; left empty, the Dockerfile's fetch step looks
      # it up itself, so this only makes the choice visible in the log.
      - name: Find the newest web release of the app
        id: webapp
        run: |
          tag=$(curl -fsS -H 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
            'https://api.github.com/repos/achamseddine/OrigamiFarmOS/releases?per_page=30' \
            | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin) if r["tag_name"].startswith("web-") and any(a["name"]=="origami-farmos-web.zip" for a in r["assets"])]; rs.sort(key=lambda r: r["published_at"], reverse=True); print(rs[0]["tag_name"] if rs else "")' \
            || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Web app release: ${tag:-none}"

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "origami-api:${{ inputs.image_tag }}" \
            --file api/Dockerfile \
            --build-arg APP_VERSION="$(git rev-parse --short HEAD)" \
            --build-arg APP_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg FARMOS_WEB_RELEASE_TAG='${{ steps.webapp.outputs.tag }}' \
            .

      - name: Point the Web App at the new image
        run: |
          az webapp config container set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --container-image-name "${{ secrets.ACR_NAME }}.azurecr.io/origami-api:${{ inputs.image_tag }}" \
            --container-registry-url "https://${{ secrets.ACR_NAME }}.azurecr.io"

      - name: Restart the Web App
        run: |
          az webapp restart \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}"

      - name: Smoke test /health
        run: |
          url="https://$(az webapp show --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "${{ secrets.AZURE_WEBAPP_NAME }}" --query defaultHostName -o tsv)/health"
          for i in $(seq 1 12); do
            if curl -fsS "$url"; then
              echo "Healthy: $url"
              exit 0
            fi
            echo "Not ready yet (attempt $i/12), waiting 10s..."
            sleep 10
          done
          echo "::error::$url never became healthy after deploy"
          exit 1
