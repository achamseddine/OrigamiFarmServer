name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      # POSTGRES_USER is the image's bootstrap superuser. The API must NOT
      # connect as it: Postgres silently exempts superusers from row-level
      # security, and since PostgreSQL 16 the bootstrap user cannot be
      # demoted either ("The bootstrap user must have the SUPERUSER
      # attribute"). So the superuser stays `postgres` and the step below
      # creates the non-superuser `origami` role the URLs connect as.
      control-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: origami_ci_password
          POSTGRES_DB: origami_control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d origami_control_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      tenant-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: origami_ci_password
          POSTGRES_DB: origami_tenant_shared_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d origami_tenant_shared_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      ENVIRONMENT: test
      CONTROL_DATABASE_URL: postgresql+psycopg://origami:origami_ci_password@localhost:5432/origami_control_test
      TENANT_DATABASE_URL: postgresql+psycopg://origami:origami_ci_password@localhost:5433/origami_tenant_shared_test
      AUTH_DEV_MODE: "true"
      APP_SECRET_KEY: ci-only-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      # Postgres silently exempts superusers from row-level security — so the
      # tenant isolation tests can only fail (or, worse, pass for the wrong
      # reason) if the API connects as one. Same rule as
      # infrastructure/sql/00_bootstrap.sql and README.md: the application
      # role is created NOSUPERUSER NOBYPASSRLS and owns its database, so
      # the migrations it runs own the tables they create.
      - name: Create the application role (RLS does not apply to superusers)
        working-directory: api
        run: |
          python - <<'EOF'
          import os
          import psycopg
          for var, dbname in (
              ("CONTROL_DATABASE_URL", "origami_control_test"),
              ("TENANT_DATABASE_URL", "origami_tenant_shared_test"),
          ):
              url = os.environ[var].replace("postgresql+psycopg://", "postgresql://")
              admin = url.replace("origami:", "postgres:", 1)
              with psycopg.connect(admin, autocommit=True) as conn:
                  if conn.execute("SELECT 1 FROM pg_roles WHERE rolname = 'origami'").fetchone() is None:
                      conn.execute("CREATE ROLE origami LOGIN PASSWORD 'origami_ci_password'")
                  conn.execute("ALTER ROLE origami NOSUPERUSER NOBYPASSRLS")
                  conn.execute(f"ALTER DATABASE {dbname} OWNER TO origami")
              with psycopg.connect(url) as conn:
                  row = conn.execute("SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user").fetchone()
                  assert row == (False, False), row
              print(f"{var}: origami owns {dbname}, NOSUPERUSER NOBYPASSRLS")
          EOF

      - name: Lint (ruff)
        working-directory: api
        run: ruff check .

      - name: Type check (mypy)
        working-directory: api
        run: mypy app

      - name: Run control-plane migrations
        working-directory: api
        run: alembic -c alembic_control.ini upgrade head

      - name: Run tenant-plane migrations (incl. RLS policies)
        working-directory: api
        run: alembic -c alembic_tenant.ini upgrade head

      - name: Run tests
        working-directory: api
        run: pytest -q

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        working-directory: admin-web
        run: npm ci

      - name: Type check
        working-directory: admin-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: admin-web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npx next build
